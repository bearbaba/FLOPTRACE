name: FLOPTRACE unified web checks
on:
  push:
    paths:
      - 'index.html'
      - 'js/unified.js'
      - 'js/did-utils.mjs'
      - 'css/unified.css'
      - 'legacy/**'
      - 'api/**'
      - 'tests/**'
      - '.github/workflows/floptrace-web.yml'
  pull_request:
    paths:
      - 'index.html'
      - 'js/unified.js'
      - 'css/unified.css'
      - 'legacy/**'
      - 'api/**'
      - 'tests/**'
      - '.github/workflows/floptrace-web.yml'
jobs:
  web-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --check js/unified.js
      - run: node --check js/did-utils.mjs
      - run: node --check api/status.js
      - run: node --check api/models.js
      - run: node --check api/infer.js
      - run: node --test tests/web.test.mjs tests/community.test.mjs
